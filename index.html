<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#09000f" />
  <title>123 — 3D Purple</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="noise"></div>
  <div class="ambient ambient-1"></div>
  <div class="ambient ambient-2"></div>

  <main class="scene">
    <div class="stars" id="stars"></div>

    <section class="hero">
      <div class="badge">3D EXPERIENCE</div>

      <div class="cube-wrap" aria-hidden="true">
        <div class="cube">
          <div class="face front">1</div>
          <div class="face back">2</div>
          <div class="face right">3</div>
          <div class="face left">1</div>
          <div class="face top">2</div>
          <div class="face bottom">3</div>
        </div>
      </div>

      <h1 class="title" data-text="123">123</h1>
      <p class="subtitle">PURPLE • BLACK • FUTURE</p>

      <div class="glass-card" id="tiltCard">
        <span class="shine"></span>
        <div class="orb"></div>
        <div class="card-content">
          <div class="mini">WELCOME</div>
          <div class="big">123</div>
          <div class="line"></div>
          <div class="small">3D neon interface</div>
        </div>
      </div>

      <button class="glow-btn" id="pulseBtn">ENTER</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
